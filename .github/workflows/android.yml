name: Android Tag Release

permissions:
  contents: write

on:
  push:
    tags:
      - '*'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Verify tag matches versionName
      run: |
        VERSION_NAME=$(sed -n 's/.*versionName\s*[\"'\'']\([^\"'\'']*\)[\"'\''].*/\1/p' app/build.gradle)
        TAG="${{ github.ref_name }}"
        echo "Tag: $TAG"
        echo "versionName: $VERSION_NAME"
        if [ "$TAG" != "$VERSION_NAME" ]; then
          echo "::error::Tag '$TAG' does not match versionName '$VERSION_NAME' in app/build.gradle"
          exit 1
        fi
      working-directory: ./SoundTest

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: ./SoundTest

    - name: Build APK
      run: ./gradlew assembleDebug
      working-directory: ./SoundTest

    - name: Create GitHub Release and upload APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        files: SoundTest/app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
